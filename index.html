<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoTrans — Premium AI Translator</title>
    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 md:p-8">
    
    <div class="w-full max-w-5xl space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between px-2">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600/20 p-2.5 rounded-xl border border-indigo-500/30 shadow-[0_0_15px_rgba(99,102,241,0.15)]">
                    <i class="fa-solid fa-earth-americas text-2xl text-indigo-400"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                        LingoTrans <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-medium tracking-normal">v2.0</span>
                    </h1>
                    <p class="text-xs text-gray-400">Instant translations, powered by Web AI</p>
                </div>
            </div>
        </div>

        <!-- Main Card container -->
        <div class="glass-panel w-full rounded-2xl md:rounded-3xl p-6 md:p-8 space-y-6 relative overflow-hidden">
            
            <!-- Language Selectors Row -->
            <div class="flex flex-col md:flex-row items-center gap-4 border-b border-gray-800/80 pb-6">
                <!-- Source language select -->
                <div class="w-full md:flex-1 flex items-center gap-3">
                    <span class="text-xs font-semibold uppercase tracking-wider text-gray-500 select-none">From:</span>
                    <div class="relative flex-1">
                        <select id="sourceLanguage" class="custom-select w-full bg-gray-900/60 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500/80 transition-colors cursor-pointer">
                            <!-- Populated by language.js/app.js -->
                        </select>
                    </div>
                </div>
                
                <!-- Swap Button -->
                <button id="swapBtn" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-900 border border-gray-800 text-gray-400 hover:text-indigo-400 hover:border-indigo-500/50 shadow-md transition-all duration-300 cursor-pointer transform hover:scale-105 active:scale-95 shrink-0" title="Swap languages">
                    <i id="swapIcon" class="fa-solid fa-right-left swap-icon rotate-90 md:rotate-0"></i>
                </button>
                
                <!-- Target language select -->
                <div class="w-full md:flex-1 flex items-center gap-3">
                    <span class="text-xs font-semibold uppercase tracking-wider text-gray-500 select-none">To:</span>
                    <div class="relative flex-1">
                        <select id="targetLanguage" class="custom-select w-full bg-gray-900/60 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500/80 transition-colors cursor-pointer">
                            <!-- Populated by language.js/app.js -->
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Textareas Section -->
            <div class="flex flex-col lg:flex-row gap-6">
                
                <!-- Source Input Panel -->
                <div class="w-full lg:w-1/2 flex flex-col min-h-[220px] bg-gray-950/40 rounded-2xl border border-gray-800/80 interactive-focus p-4 transition-all">
                    <textarea id="inputText" class="flex-1 w-full bg-transparent resize-none outline-none border-none text-white text-base md:text-lg placeholder-gray-500 focus:ring-0 min-h-[150px]" placeholder="Type or speak text to translate..." maxlength="5000"></textarea>
                    
                    <!-- Bottom Controls of source -->
                    <div class="flex items-center justify-between pt-4 mt-2 border-t border-gray-900/50">
                        <div class="flex items-center gap-2">
                            <button id="micBtn" class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-900 border border-gray-800/80 text-gray-400 hover:text-red-400 hover:bg-gray-800/50 transition-all cursor-pointer" title="Speech to text (Voice typing)">
                                <i class="fa-solid fa-microphone"></i>
                            </button>
                            <button id="speakFromBtn" class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-900 border border-gray-800/80 text-gray-400 hover:text-indigo-400 hover:bg-gray-800/50 transition-all cursor-pointer" title="Listen to input text">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <button id="copyFromBtn" class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-900 border border-gray-800/80 text-gray-400 hover:text-indigo-400 hover:bg-gray-800/50 transition-all cursor-pointer" title="Copy text to clipboard">
                                <i class="fa-solid fa-copy"></i>
                            </button>
                        </div>
                        <span id="charCount" class="text-xs text-gray-500 font-mono select-none">0 / 5000</span>
                    </div>
                </div>
                
                <!-- Target Output Panel -->
                <div class="w-full lg:w-1/2 flex flex-col min-h-[220px] bg-gray-950/40 rounded-2xl border border-gray-800/80 interactive-focus p-4 transition-all relative">
                    <!-- Loading overlay inside output panel -->
                    <div id="loadingOverlay" class="absolute inset-0 bg-gray-950/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center gap-3 transition-opacity duration-300 opacity-0 pointer-events-none z-10">
                        <div class="w-8 h-8 rounded-full border-2 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
                        <span class="text-xs text-indigo-400 font-medium tracking-wide">Translating...</span>
                    </div>
                    
                    <textarea id="outputText" class="flex-1 w-full bg-transparent resize-none outline-none border-none text-white text-base md:text-lg placeholder-gray-600 focus:ring-0 min-h-[150px]" placeholder="Translated text will appear here..." readonly></textarea>
                    
                    <!-- Bottom Controls of target -->
                    <div class="flex items-center justify-between pt-4 mt-2 border-t border-gray-900/50">
                        <div class="flex items-center gap-2">
                            <button id="speakToBtn" class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-900 border border-gray-800/80 text-gray-400 hover:text-indigo-400 hover:bg-gray-800/50 transition-all cursor-pointer" title="Listen to translation">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <button id="copyToBtn" class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-900 border border-gray-800/80 text-gray-400 hover:text-indigo-400 hover:bg-gray-800/50 transition-all cursor-pointer" title="Copy translation to clipboard">
                                <i class="fa-solid fa-copy"></i>
                            </button>
                        </div>
                        <!-- Empty for padding balance -->
                        <div></div>
                    </div>
                </div>
            </div>
            
            <!-- Actions Footer Row -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-gray-800/80">
                <button id="historyToggleBtn" class="text-sm font-medium text-gray-400 hover:text-white flex items-center gap-2 transition-colors cursor-pointer py-2 px-1">
                    <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                    <span>View Translation History</span>
                </button>
                
                <button id="translateBtn" class="premium-btn w-full sm:w-auto px-8 py-3.5 text-white font-semibold rounded-xl text-sm md:text-base flex items-center justify-center gap-2 transition-all cursor-pointer">
                    <span>Translate Text</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>

            <!-- Collapsible History Panel -->
            <div id="historyPanel" class="history-drawer border-t border-gray-800/60 pt-4 mt-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500 select-none">Recent Translations</h3>
                    <button id="clearHistoryBtn" class="text-xs text-red-400/70 hover:text-red-400 transition-colors cursor-pointer">
                        Clear All
                    </button>
                </div>
                <div id="historyList" class="space-y-2 max-h-[220px] overflow-y-auto pr-1">
                    <!-- Dynamically populated or empty message -->
                    <p class="text-sm text-gray-500 italic select-none">No translation history yet.</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Floating Toast Notifications -->
    <div id="toastNotification" class="toast-notification flex items-center gap-3 px-4 py-3 rounded-xl border border-gray-800">
        <i id="toastIcon" class="fa-solid fa-circle-check text-indigo-400 text-lg"></i>
        <span id="toastMsg" class="text-sm font-medium text-white">Copied to clipboard!</span>
    </div>

    <script src="language.js"></script>
    <script src="app.js"></script>
</body>
</html>
