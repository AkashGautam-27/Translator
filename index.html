<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <link rel="stylesheet" href="style.css">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        
</head>
<body>
   <div>
    <div class="flex items-center justify-center h-screen ">
        <div class="w-full max-w-[400px] md:max-w-[500px] p-4 md:p-8 space-y-6 bg-white rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold text-center">Language-Translator</h2>
            <div class="space-y-4 ">
                
                   
                   <div class="flex flex-col md:flex-row gap-4 rounded-md">
                  <div class="w-full md:w-1/2">
                      <textarea id="inputText" rows="4" class="w-full px-3 py-2 mt-1 border rounded-md focus:outline-none focus:ring focus:ring-blue-200" placeholder="Enter text to translate..." ></textarea>
                      <div class="flex justify-evenly  gap-2">
                      <div class="flex gap-4 bg-gray-100 p-2 rounded-md">
                          <div  class="cursor-pointer transition-all scale-100 hover:scale-110 text-gray-500 hover:text-gray-700 ">
                            <i class="fa-solid fa-bullhorn"  data-speech="from"></i>
                        </div>
                         <div  class="cursor-pointer text-gray-500 transition-all scale-100 hover:scale-110 hover:text-gray-700">
                           <i class="fa-solid fa-copy" data-copy="from" ></i>
                        </div>
                        <select name="targetLanguage" id="targetLanguage" class="bg-gray-100 border border-gray-300 rounded-md  text-gray-700 focus:outline-none focus:ring focus:ring-blue-200">
                           
                        </select>
                      </div>

                      </div>
                  </div>
                  <div >
                      <textarea id="outputText" rows="4" class="w-full px-3 py-2 mt-1 border rounded-md focus:outline-none focus:ring focus:ring-blue-200" placeholder="Translated text will appear here..." readonly></textarea>
                       <div class="flex justify-evenly  gap-2">
                      <div class="flex gap-4 bg-gray-100 p-2 rounded-md">
                          <div  class="cursor-pointer transition-all scale-100 hover:scale-110 text-gray-500 hover:text-gray-700">
                            <i class="fa-solid fa-bullhorn"  data-speech="to"></i>
                        </div>
                         <div  class="cursor-pointer text-gray-500 transition-all scale-100 hover:scale-110 hover:text-gray-700">
                           <i class="fa-solid fa-copy" data-copy="to"></i>
                        </div>
                         <select name="targetLanguage" id="targetLanguage" class="bg-gray-100 text-gray-700 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-200">
                          
                        </select>
                      </div>
                  </div>
                   </div>
                   </div>
                <div class="flex  justify-center gap-4">
                     <button id="translateBtn" class="w-[60%] transition-all scale-100 hover:scale-110 flex justify-center px-4 py-2 font-semibold text-white bg-blue-500 rounded-md hover:bg-blue-600 focus:outline-none focus:ring focus:ring-blue-200">Translate</button>
                </div>
            </div>
   </div>
   <script src="language.js"></script>
   <script src="app.js"></script>
</body>
</html>
